# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100 # Hz


    rm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster




rm_group_controller:
  ros__parameters:
    allow_nonzero_velocity_at_trajectory_end: false
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - left_finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity