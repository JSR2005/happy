ompl:
  # 全局碰撞检测配置（MoveIt官方合法参数）
  collision_detection:
    type: FAST  # 快速碰撞检测模式（替代HYBRID）
    tolerance: 0.001  # 碰撞检测容差
    min_collision_distance: 0.0  # 仅检测完全相交，不检测接近
    contact_distance: 0.0  # 关闭接近碰撞检测
    max_contacts: 10  # 最大碰撞接触点数量
  arm1_group:
    planner_configs:
      - RRTConnectkConfigDefault
    default_planner_config: RRTConnectkConfigDefault
    longest_valid_segment_fraction: 0.01
    RRTConnectkConfigDefault:
      type: geometric::RRTConnect
      range: 0.0  # 自动适配
      goal_bias: 0.05
  arm2_group:
    planner_configs:
      - RRTConnectkConfigDefault
    default_planner_config: RRTConnectkConfigDefault
    longest_valid_segment_fraction: 0.01
    RRTConnectkConfigDefault:
      type: geometric::RRTConnect
      range: 0.0
      goal_bias: 0.05
  arm1_gripper_group:
    planner_configs:
      - RRTConnectkConfigDefault
    default_planner_config: RRTConnectkConfigDefault
  arm2_gripper_group:
    planner_configs:
      - RRTConnectkConfigDefault
    default_planner_config: RRTConnectkConfigDefault